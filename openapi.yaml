openapi: 3.0.3
info:
  title: Esketit Music Server API
  version: 1.4.0
  description: |
    REST API for listing and uploading media files, managing albums, tracks, authors,
    user playlists, and authenticating users with access and refresh tokens.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
  - name: Songs
  - name: Album Covers
  - name: Albums
  - name: Tracks
  - name: Authors
  - name: Author Photos
  - name: Search
  - name: Playlists
  - name: Autoplay
  - name: Analytics
  - name: Telegram

paths:
  /api/auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /api/songs:
    get:
      tags: [Songs]
      summary: List songs
      responses:
        '200':
          description: Song list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Songs]
      summary: Upload song
      description: |
        Upload a song file and receive a `/api/songs/{name}` URL that can be stored in
        track `audioFilePath`.

        The server preserves the original extension but rewrites the stored filename
        by appending a random suffix before the extension.

        Song files are managed separately from track records. Updating or deleting a
        track does not remove any previously uploaded file from song storage.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Uploaded song metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/songs/unused:
    get:
      tags: [Songs]
      summary: List unused songs
      description: |
        List uploaded song files from `/api/songs` that are not referenced by any track
        `audioFilePath`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unused song list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/songs/{name}:
    get:
      tags: [Songs]
      summary: Get song file
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          description: Song file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Songs]
      summary: Delete song file
      description: |
        Delete an uploaded song file from `/api/songs/{name}`.

        The server refuses to delete the file while any track still references it
        through `audioFilePath`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Song file is referenced by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/album-covers:
    post:
      tags: [Album Covers]
      summary: Upload album cover
      description: |
        Upload an album cover file. The returned file can later be referenced from album
        or playlist `coverImagePath`. Preferred write format is `/api/album-covers/{name}`.

        The server preserves the original extension but rewrites the stored filename
        by appending a random suffix before the extension.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Uploaded album cover metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/album-covers/suggestions:
    get:
      tags: [Album Covers]
      summary: Search album cover suggestions
      description: |
        Search for remotely hosted album cover candidates using the configured image-search
        provider. Returns only results with image URLs and positive dimensions.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          example: Nevermind cover image
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: Album cover suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumCoverSuggestionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: Search provider is not configured
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '502':
          description: Search provider request failed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'

  /api/album-covers/import:
    post:
      tags: [Album Covers]
      summary: Import a remote album cover
      description: |
        Download a remote image, validate that it is a supported album cover image, and store
        it using the same mechanism as normal album cover uploads.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCoverImportRequest'
      responses:
        '201':
          description: Imported album cover metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumCoverImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Remote image download failed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'

  /api/album-covers/{name}:
    get:
      tags: [Album Covers]
      summary: Get album cover file
      description: |
        Fetch an album cover file by filename. Album responses expose `coverImagePath`
        as a full absolute URL pointing to this route.
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          description: Album cover file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/author-photos:
    post:
      tags: [Author Photos]
      summary: Upload author photo
      description: |
        Upload an author photo file. The returned `url` can later be stored in an
        author's `photos` array.

        The server preserves the original extension but rewrites the stored filename
        by appending a random suffix before the extension.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Uploaded author photo metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/author-photos/{name}:
    get:
      tags: [Author Photos]
      summary: Get author photo file
      description: |
        Fetch an author photo file by filename. Author `photos` entries may point
        to this route using `/api/author-photos/{name}`.
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          description: Author photo file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/authors:
    get:
      tags: [Authors]
      summary: List authors
      responses:
        '200':
          description: Author list sorted by ID asc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      tags: [Authors]
      summary: Create author
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthorRequest'
      responses:
        '201':
          description: Created author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/authors/{id}:
    get:
      tags: [Authors]
      summary: Get author by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Authors]
      summary: Update author by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthorRequest'
      responses:
        '200':
          description: Updated author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Authors]
      summary: Delete author by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Author is used by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/albums:
    get:
      tags: [Albums]
      summary: List albums
      description: |
        Returns albums for both admin and player clients. Admin requests can include
        albums with no tracks. Anonymous and listener requests omit albums whose
        `trackIds` array is empty.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: authorId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: query
          in: query
          schema:
            type: string
        - name: isPublished
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Album page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbums'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Albums]
      summary: Create album
      description: Albums may be created as published even when `trackIds` is empty.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAlbumRequest'
      responses:
        '201':
          description: Created album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/albums/{id}:
    get:
      tags: [Albums]
      summary: Get album by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Albums]
      summary: Update album by ID
      description: Albums may remain published even when `trackIds` is empty.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAlbumRequest'
      responses:
        '200':
          description: Updated album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Albums]
      summary: Delete album by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Album is used by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/albums/{id}/tracks:
    get:
      tags: [Albums]
      summary: List album tracks in album order
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Tracks in album order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/playlists:
    get:
      tags: [Playlists]
      summary: List current user's playlists
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            $ref: '#/components/schemas/PlaylistVisibility'
      responses:
        '200':
          description: Playlist page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlaylists'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Playlists]
      summary: Create playlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPlaylistRequest'
      responses:
        '201':
          description: Created playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/playlists/{id}:
    get:
      tags: [Playlists]
      summary: Get current user's playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Playlists]
      summary: Update playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPlaylistRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Playlists]
      summary: Delete playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/playlists/{id}/cover:
    post:
      tags: [Playlists]
      summary: Upload playlist cover image
      description: |
        Upload a cover image for one of the current user's custom playlists.
        The file is stored under `/api/album-covers/{name}` and the playlist's
        `coverImagePath` is updated to that path. Favorites playlists cannot be
        modified through this endpoint.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /api/playlists/{id}/tracks:
    get:
      tags: [Playlists]
      summary: List playlist tracks in playlist order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Playlist track page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTracks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /api/public/playlists/{id}:
    get:
      tags: [Playlists]
      summary: Get a public playlist by ID
      description: |
        Anonymous-safe playlist read endpoint. Only playlists with `visibility`
        set to `public` are returned; private and shared playlists return 404.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Public playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

