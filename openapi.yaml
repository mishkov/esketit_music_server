openapi: 3.0.3
info:
  title: Esketit Music Server API
  version: 1.3.0
  description: |
    REST API for listing and uploading media files, managing albums, tracks, authors,
    user playlists, and authenticating users with access and refresh tokens.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
  - name: Songs
  - name: Album Covers
  - name: Albums
  - name: Tracks
  - name: Authors
  - name: Playlists

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /songs:
    get:
      tags: [Songs]
      summary: List songs
      responses:
        '200':
          description: Song list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Songs]
      summary: Upload song
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Uploaded song metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /songs/{name}:
    get:
      tags: [Songs]
      summary: Get song file
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          description: Song file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /album-covers:
    post:
      tags: [Album Covers]
      summary: Upload album cover
      description: |
        Upload an album cover file. The returned file can later be referenced from album
        `coverImagePath`. Preferred write format is `/album-covers/{name}`.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Uploaded album cover metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /album-covers/{name}:
    get:
      tags: [Album Covers]
      summary: Get album cover file
      description: |
        Fetch an album cover file by filename. Album responses expose `coverImagePath`
        as a full absolute URL pointing to this route.
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          description: Album cover file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors:
    get:
      tags: [Authors]
      summary: List authors
      responses:
        '200':
          description: Author list sorted by ID asc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      tags: [Authors]
      summary: Create author
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthorRequest'
      responses:
        '201':
          description: Created author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors/{id}:
    get:
      tags: [Authors]
      summary: Get author by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Authors]
      summary: Update author by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthorRequest'
      responses:
        '200':
          description: Updated author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Authors]
      summary: Delete author by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Author is used by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /albums:
    get:
      tags: [Albums]
      summary: List albums
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: authorId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: query
          in: query
          schema:
            type: string
        - name: isPublished
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Album page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbums'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Albums]
      summary: Create album
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAlbumRequest'
      responses:
        '201':
          description: Created album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /albums/{id}:
    get:
      tags: [Albums]
      summary: Get album by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Albums]
      summary: Update album by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAlbumRequest'
      responses:
        '200':
          description: Updated album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Albums]
      summary: Delete album by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Album is used by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /albums/{id}/tracks:
    get:
      tags: [Albums]
      summary: List album tracks in album order
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Tracks in album order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists:
    get:
      tags: [Playlists]
      summary: List current user's playlists
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            $ref: '#/components/schemas/PlaylistVisibility'
      responses:
        '200':
          description: Playlist page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlaylists'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Playlists]
      summary: Create playlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPlaylistRequest'
      responses:
        '201':
          description: Created playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /playlists/{id}:
    get:
      tags: [Playlists]
      summary: Get current user's playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Playlists]
      summary: Update playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPlaylistRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Playlists]
      summary: Delete playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /playlists/{id}/tracks:
    get:
      tags: [Playlists]
      summary: List playlist tracks in playlist order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Playlist track page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTracks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/tracks/order:
    put:
      tags: [Playlists]
      summary: Reorder playlist tracks by full track ID list
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderPlaylistTracksRequest'
      responses:
        '204':
          description: Reordered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}/playlists:
    post:
      tags: [Playlists]
      summary: Add a track to multiple playlists
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTrackToPlaylistsRequest'
      responses:
        '204':
          description: Added
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}/playlists/{playlistId}:
    delete:
      tags: [Playlists]
      summary: Remove a track from a playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: playlistId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}/favorite:
    put:
      tags: [Playlists]
      summary: Add a track to the current user's favorites playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Favorited
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Playlists]
      summary: Remove a track from the current user's favorites playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Removed from favorites
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks:
    get:
      tags: [Tracks]
      summary: List tracks
      responses:
        '200':
          description: Track list sorted by ID asc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
    post:
      tags: [Tracks]
      summary: Create track
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTrackRequest'
      responses:
        '201':
          description: Created track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}:
    get:
      tags: [Tracks]
      summary: Get track by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tracks]
      summary: Update track by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTrackRequest'
      responses:
        '200':
          description: Updated track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Tracks]
      summary: Delete track by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FileName:
      name: name
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    Forbidden:
      description: Insufficient permissions
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    Conflict:
      description: Resource already exists or cannot be modified in the requested way
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    InternalServerError:
      description: Internal server error
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'

  schemas:
    PlainError:
      type: string

    FileUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

    FileInfo:
      type: object
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        lastModified:
          type: string
          format: date-time
        url:
          type: string
      required: [name, sizeBytes, lastModified, url]

    AdditionalInfo:
      type: object
      required: [type]
      properties:
        type:
          type: string
      additionalProperties: true

    TextAdditionalInfo:
      allOf:
        - $ref: '#/components/schemas/AdditionalInfo'
        - type: object
          properties:
            type:
              type: string
              enum: [text]
            title:
              type: string
            text:
              type: string
          required: [type, title, text]

    Author:
      type: object
      properties:
        id:
          type: integer
          format: int64
        currentName:
          type: string
        photos:
          type: array
          items:
            type: string
      required: [id, currentName, photos]

    UpsertAuthorRequest:
      type: object
      properties:
        currentName:
          type: string
          minLength: 1
        photos:
          type: array
          items:
            type: string
      required: [currentName, photos]

    Album:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        coverImagePath:
          type: string
          format: uri
          description: |
            Absolute URL to the album cover file. API responses normalize this field to a
            full URL pointing to `/album-covers/{name}`.
          example: http://192.168.1.6:8080/album-covers/%D0%93%D0%BE%D1%80%D0%B3%D0%BE%D1%80%D0%BE%D0%B4_2.jpg
        authorIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        releaseDate:
          type: string
          format: date-time
        isPublished:
          type: boolean
        trackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
      required: [id, title, coverImagePath, authorIds, releaseDate, isPublished, trackIds, additionalInfo]

    UpsertAlbumRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        coverImagePath:
          type: string
          description: |
            Album cover reference. Preferred form is `/album-covers/{name}`.
            Absolute URLs are also accepted. Bare filenames may be normalized by the
            server, but clients should not rely on that form.
          example: /album-covers/%D0%93%D0%BE%D1%80%D0%B3%D0%BE%D1%80%D0%BE%D0%B4_2.jpg
        authorIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          description: Ignored on write; server recalculates this field from album tracks.
        releaseDate:
          type: string
          format: date-time
        isPublished:
          type: boolean
        trackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
      required: [title, releaseDate, isPublished, trackIds, additionalInfo]

    Track:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        authorIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        albumId:
          type: integer
          format: int64
          minimum: 1
        audioFilePath:
          type: string
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
        isFavorite:
          type: boolean
        isAvailable:
          type: boolean
      required: [id, name, authorIds, albumId, audioFilePath, additionalInfo, isFavorite, isAvailable]

    UpsertTrackRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        authorIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
        albumId:
          type: integer
          format: int64
          minimum: 1
        albumOrder:
          type: integer
          minimum: 0
        audioFilePath:
          type: string
          minLength: 1
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
      required: [name, authorIds, albumId, albumOrder, audioFilePath, additionalInfo]

    PlaylistVisibility:
      type: string
      enum: [private, public, shared]

    Playlist:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        coverImagePath:
          type: string
        visibility:
          $ref: '#/components/schemas/PlaylistVisibility'
        trackCount:
          type: integer
        system:
          type: boolean
        isFavorites:
          type: boolean
      required: [id, userId, name, description, coverImagePath, visibility, trackCount, system, isFavorites]

    UpsertPlaylistRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 1000
        coverImagePath:
          type: string
        visibility:
          $ref: '#/components/schemas/PlaylistVisibility'
      required: [name, description, coverImagePath, visibility]

    AddTrackToPlaylistsRequest:
      type: object
      properties:
        playlistIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
      required: [playlistIds]

    ReorderPlaylistTracksRequest:
      type: object
      properties:
        trackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
      required: [trackIds]

    PaginatedAlbums:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Album'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    PaginatedTracks:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    PaginatedPlaylists:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    PublicUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, listener]
        createdAt:
          type: string
          format: date-time
      required: [id, email, role, createdAt]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
      required:
        - user
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
