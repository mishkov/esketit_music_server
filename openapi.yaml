openapi: 3.0.3
info:
  title: Esketit Music Server API
  version: 1.3.0
  description: |
    REST API for listing and uploading media files, managing albums, tracks, authors,
    user playlists, and authenticating users with access and refresh tokens.

servers:
  - url: http://localhost:8080
    description: Local development server

tags:
  - name: Auth
  - name: Songs
  - name: Album Covers
  - name: Albums
  - name: Tracks
  - name: Authors
  - name: Search
  - name: Playlists
  - name: Autoplay
  - name: Telegram

paths:
  /auth/register:
    post:
      tags: [Auth]
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '201':
          description: Registered and authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '409':
          description: Email already exists
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/login:
    post:
      tags: [Auth]
      summary: Log in with email and password
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/refresh:
    post:
      tags: [Auth]
      summary: Rotate refresh token and issue a new access token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: Rotated successfully
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/logout:
    post:
      tags: [Auth]
      summary: Revoke a refresh token
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '204':
          description: Logged out
        '400':
          $ref: '#/components/responses/BadRequest'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /auth/me:
    get:
      tags: [Auth]
      summary: Get the currently authenticated user
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublicUser'
        '401':
          $ref: '#/components/responses/Unauthorized'

  /songs:
    get:
      tags: [Songs]
      summary: List songs
      responses:
        '200':
          description: Song list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '500':
          $ref: '#/components/responses/InternalServerError'
    post:
      tags: [Songs]
      summary: Upload song
      description: |
        Upload a song file and receive a `/songs/{name}` URL that can be stored in
        track `audioFilePath`.

        The server preserves the original extension but rewrites the stored filename
        by appending a random suffix before the extension.

        Song files are managed separately from track records. Updating or deleting a
        track does not remove any previously uploaded file from song storage.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Uploaded song metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /songs/unused:
    get:
      tags: [Songs]
      summary: List unused songs
      description: |
        List uploaded song files from `/songs` that are not referenced by any track
        `audioFilePath`.
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Unused song list
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/FileInfo'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /songs/{name}:
    get:
      tags: [Songs]
      summary: Get song file
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          description: Song file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Songs]
      summary: Delete song file
      description: |
        Delete an uploaded song file from `/songs/{name}`.

        The server refuses to delete the file while any track still references it
        through `audioFilePath`.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Song file is referenced by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /album-covers:
    post:
      tags: [Album Covers]
      summary: Upload album cover
      description: |
        Upload an album cover file. The returned file can later be referenced from album
        `coverImagePath`. Preferred write format is `/album-covers/{name}`.

        The server preserves the original extension but rewrites the stored filename
        by appending a random suffix before the extension.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/FileUploadRequest'
      responses:
        '201':
          description: Uploaded album cover metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FileInfo'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /album-covers/suggestions:
    get:
      tags: [Album Covers]
      summary: Search album cover suggestions
      description: |
        Search for remotely hosted album cover candidates using the configured image-search
        provider. Returns only results with image URLs and positive dimensions.
      security:
        - bearerAuth: []
      parameters:
        - name: query
          in: query
          required: true
          schema:
            type: string
            minLength: 1
          example: Nevermind cover image
        - name: limit
          in: query
          required: false
          schema:
            type: integer
            minimum: 1
            maximum: 20
            default: 20
      responses:
        '200':
          description: Album cover suggestions
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumCoverSuggestionsResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '501':
          description: Search provider is not configured
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '502':
          description: Search provider request failed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'

  /album-covers/import:
    post:
      tags: [Album Covers]
      summary: Import a remote album cover
      description: |
        Download a remote image, validate that it is a supported album cover image, and store
        it using the same mechanism as normal album cover uploads.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AlbumCoverImportRequest'
      responses:
        '201':
          description: Imported album cover metadata
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AlbumCoverImportResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '502':
          description: Remote image download failed
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'

  /album-covers/{name}:
    get:
      tags: [Album Covers]
      summary: Get album cover file
      description: |
        Fetch an album cover file by filename. Album responses expose `coverImagePath`
        as a full absolute URL pointing to this route.
      parameters:
        - $ref: '#/components/parameters/FileName'
      responses:
        '200':
          description: Album cover file stream
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors:
    get:
      tags: [Authors]
      summary: List authors
      responses:
        '200':
          description: Author list sorted by ID asc
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Author'
    post:
      tags: [Authors]
      summary: Create author
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthorRequest'
      responses:
        '201':
          description: Created author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /authors/{id}:
    get:
      tags: [Authors]
      summary: Get author by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Authors]
      summary: Update author by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAuthorRequest'
      responses:
        '200':
          description: Updated author
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Author'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Authors]
      summary: Delete author by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Author is used by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /albums:
    get:
      tags: [Albums]
      summary: List albums
      description: |
        Returns albums for both admin and player clients. Admin requests can include
        albums with no tracks. Anonymous and listener requests omit albums whose
        `trackIds` array is empty.
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: authorId
          in: query
          schema:
            type: integer
            format: int64
            minimum: 1
        - name: query
          in: query
          schema:
            type: string
        - name: isPublished
          in: query
          schema:
            type: boolean
      responses:
        '200':
          description: Album page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAlbums'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Albums]
      summary: Create album
      description: Albums may be created as published even when `trackIds` is empty.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAlbumRequest'
      responses:
        '201':
          description: Created album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /albums/{id}:
    get:
      tags: [Albums]
      summary: Get album by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Albums]
      summary: Update album by ID
      description: Albums may remain published even when `trackIds` is empty.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertAlbumRequest'
      responses:
        '200':
          description: Updated album
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Album'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Albums]
      summary: Delete album by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '409':
          description: Album is used by one or more tracks
          content:
            text/plain:
              schema:
                $ref: '#/components/schemas/PlainError'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /albums/{id}/tracks:
    get:
      tags: [Albums]
      summary: List album tracks in album order
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Tracks in album order
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists:
    get:
      tags: [Playlists]
      summary: List current user's playlists
      security:
        - bearerAuth: []
      parameters:
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - name: query
          in: query
          schema:
            type: string
        - name: visibility
          in: query
          schema:
            $ref: '#/components/schemas/PlaylistVisibility'
      responses:
        '200':
          description: Playlist page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPlaylists'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      tags: [Playlists]
      summary: Create playlist
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPlaylistRequest'
      responses:
        '201':
          description: Created playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /playlists/{id}:
    get:
      tags: [Playlists]
      summary: Get current user's playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Playlists]
      summary: Update playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertPlaylistRequest'
      responses:
        '200':
          description: Updated playlist
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Playlist'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Playlists]
      summary: Delete playlist by ID
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /playlists/{id}/tracks:
    get:
      tags: [Playlists]
      summary: List playlist tracks in playlist order
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: page
          in: query
          schema:
            type: integer
            minimum: 1
            default: 1
        - name: pageSize
          in: query
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
      responses:
        '200':
          description: Playlist track page
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTracks'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'

  /playlists/{id}/tracks/order:
    put:
      tags: [Playlists]
      summary: Reorder playlist tracks by full track ID list
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ReorderPlaylistTracksRequest'
      responses:
        '204':
          description: Reordered
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /autoplay/next:
    post:
      tags: [Autoplay]
      summary: Build the next continuation queue for the current user
      description: |
        Stateless autoplay continuation endpoint. The client sends the current
        listening context, desired profile, and track IDs that should be avoided
        because they were recently played or are already queued.

        This first backend version uses a random stub strategy. The request contract
        is intended to stay stable as smarter ranking is added later.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AutoplayNextRequest'
      responses:
        '200':
          description: Next continuation tracks
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AutoplayNextResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}/playlists:
    post:
      tags: [Playlists]
      summary: Add a track to multiple playlists
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddTrackToPlaylistsRequest'
      responses:
        '204':
          description: Added
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}/playlists/{playlistId}:
    delete:
      tags: [Playlists]
      summary: Remove a track from a playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
        - name: playlistId
          in: path
          required: true
          schema:
            type: integer
            format: int64
            minimum: 1
      responses:
        '204':
          description: Removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}/favorite:
    put:
      tags: [Playlists]
      summary: Add a track to the current user's favorites playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Favorited
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Playlists]
      summary: Remove a track from the current user's favorites playlist
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Removed from favorites
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /search:
    get:
      tags: [Search]
      summary: Search authors, albums, and tracks
      description: |
        Public substring search across author names, album titles, and track names.
        Results are returned as a single combined paginated list.

        Anonymous and listener requests omit albums whose `trackIds` array is empty.
        Admin requests may include empty albums when authenticated.
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: query
          schema:
            type: string
          description: Case-insensitive substring match
      responses:
        '200':
          description: Combined paginated search results
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedSearchResults'

  /tracks:
    get:
      tags: [Tracks]
      summary: List tracks
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
          description: Page number, defaults to 1
        - in: query
          name: pageSize
          schema:
            type: integer
            minimum: 1
            maximum: 100
          description: Page size, defaults to 20
        - in: query
          name: query
          schema:
            type: string
          description: Case-insensitive substring match against track name
        - in: query
          name: authorId
          schema:
            type: integer
            minimum: 1
          description: Filter tracks by author membership
        - in: query
          name: albumId
          schema:
            type: integer
            minimum: 1
          description: Filter tracks by album ID
      responses:
        '200':
          description: Paginated track list sorted by ID asc
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedTracks'
        '400':
          $ref: '#/components/responses/BadRequest'
    post:
      tags: [Tracks]
      summary: Create track
      description: |
        Create a track record that points to an already uploaded song file via
        `audioFilePath`, typically `/songs/{name}`.

        This endpoint only creates track metadata. It does not upload an MP3, move
        an MP3, or delete any MP3 file. The client must upload the song separately
        before creating the track.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTrackRequest'
      responses:
        '201':
          description: Created track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}:
    get:
      tags: [Tracks]
      summary: Get track by ID
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tracks]
      summary: Update track by ID
      description: |
        Update track metadata, including `audioFilePath`.

        If `audioFilePath` is changed from one MP3 to another, the server only
        updates the stored path on the track record.

        The previously referenced MP3 file is not removed from `/songs`.
        The newly referenced MP3 file is not uploaded automatically by this
        endpoint either. Clients must upload the replacement file separately and
        must remove the old file separately if they want it deleted.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTrackRequest'
      responses:
        '200':
          description: Updated track
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Track'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Tracks]
      summary: Delete track by ID
      description: |
        Delete the track record only.

        This operation does not delete the MP3 file referenced by
        `audioFilePath`, even if that file is no longer used by any track. If the
        client wants the underlying file removed from `/songs`, it must do that as
        a separate cleanup step.
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /tracks/{id}/lyrics:
    get:
      tags: [Tracks]
      summary: Get lyrics for a track
      description: |
        Returns the dedicated lyrics aggregate for a track. Lyrics are never embedded
        into track list endpoints.
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '200':
          description: Track lyrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackLyrics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '404':
          $ref: '#/components/responses/NotFound'
    put:
      tags: [Tracks]
      summary: Create or fully replace track lyrics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UpsertTrackLyricsRequest'
            examples:
              plain:
                value:
                  type: plain
                  languageCode: en
                  isVerified: true
                  source: artist
                  plainText: Full lyrics here
              synced:
                value:
                  type: synced
                  languageCode: en
                  isVerified: true
                  source: artist
                  lines:
                    - startMs: 0
                      endMs: 4200
                      text: First line
                    - startMs: 4200
                      endMs: 7600
                      text: Second line
      responses:
        '200':
          description: Replaced existing lyrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackLyrics'
        '201':
          description: Created new lyrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TrackLyrics'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'
    delete:
      tags: [Tracks]
      summary: Delete track lyrics
      security:
        - bearerAuth: []
      parameters:
        - $ref: '#/components/parameters/ResourceId'
      responses:
        '204':
          description: Deleted
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '500':
          $ref: '#/components/responses/InternalServerError'

  /telegram/import-sessions:
    post:
      tags: [Telegram]
      summary: Start a Telegram import session
      description: |
        Scan a public Telegram channel for audio tracks and start an import session.

        When `startMessageId` is provided, only tracks from that Telegram message ID
        and newer are included in the session.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TelegramStartImportRequest'
      responses:
        '201':
          description: Import session created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TelegramImportSession'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '409':
          $ref: '#/components/responses/Conflict'
        '500':
          $ref: '#/components/responses/InternalServerError'

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ResourceId:
      name: id
      in: path
      required: true
      schema:
        type: integer
        format: int64
        minimum: 1
    FileName:
      name: name
      in: path
      required: true
      schema:
        type: string

  responses:
    BadRequest:
      description: Invalid request
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    Unauthorized:
      description: Authentication required or invalid credentials
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    Forbidden:
      description: Insufficient permissions
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    NotFound:
      description: Resource not found
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    Conflict:
      description: Resource already exists or cannot be modified in the requested way
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'
    InternalServerError:
      description: Internal server error
      content:
        text/plain:
          schema:
            $ref: '#/components/schemas/PlainError'

  schemas:
    PlainError:
      type: string

    FileUploadRequest:
      type: object
      properties:
        file:
          type: string
          format: binary
      required: [file]

    FileInfo:
      type: object
      properties:
        name:
          type: string
        sizeBytes:
          type: integer
          format: int64
        lastModified:
          type: string
          format: date-time
        path:
          type: string
          description: Media path for the file, for example `/songs/example.mp3`.
        url:
          type: string
      required: [name, sizeBytes, lastModified, path, url]

    AlbumCoverSuggestionsResponse:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/AlbumCoverSuggestion'
      required: [items]

    AlbumCoverSuggestion:
      type: object
      properties:
        thumbnailUrl:
          type: string
          format: uri
        imageUrl:
          type: string
          format: uri
        width:
          type: integer
          minimum: 1
        height:
          type: integer
          minimum: 1
        sourcePageUrl:
          type: string
          format: uri
      required: [thumbnailUrl, imageUrl, width, height, sourcePageUrl]

    AlbumCoverImportRequest:
      type: object
      properties:
        imageUrl:
          type: string
          format: uri
        suggestedFileName:
          type: string
      required: [imageUrl]

    AlbumCoverImportResponse:
      type: object
      properties:
        name:
          type: string
        url:
          type: string
      required: [name, url]

    AdditionalInfo:
      type: object
      required: [type]
      properties:
        type:
          type: string
      additionalProperties: true

    TextAdditionalInfo:
      allOf:
        - $ref: '#/components/schemas/AdditionalInfo'
        - type: object
          properties:
            type:
              type: string
              enum: [text]
            title:
              type: string
            text:
              type: string
          required: [type, title, text]

    Author:
      type: object
      properties:
        id:
          type: integer
          format: int64
        currentName:
          type: string
        photos:
          type: array
          items:
            type: string
      required: [id, currentName, photos]

    UpsertAuthorRequest:
      type: object
      properties:
        currentName:
          type: string
          minLength: 1
        photos:
          type: array
          items:
            type: string
      required: [currentName, photos]

    Album:
      type: object
      properties:
        id:
          type: integer
          format: int64
        title:
          type: string
        coverImagePath:
          type: string
          format: uri
          description: |
            Absolute URL to the album cover file. API responses normalize this field to a
            full URL pointing to `/album-covers/{name}`.
          example: http://192.168.1.6:8080/album-covers/%D0%93%D0%BE%D1%80%D0%B3%D0%BE%D1%80%D0%BE%D0%B4_2.jpg
        authorIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        releaseDate:
          type: string
          format: date-time
        isPublished:
          type: boolean
        trackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          description: |
            May be empty. Non-admin album list responses omit albums whose `trackIds`
            array is empty.
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
      required: [id, title, coverImagePath, authorIds, releaseDate, isPublished, trackIds, additionalInfo]

    UpsertAlbumRequest:
      type: object
      properties:
        title:
          type: string
          minLength: 1
        coverImagePath:
          type: string
          description: |
            Album cover reference. Preferred form is `/album-covers/{name}`.
            Absolute URLs are also accepted. Bare filenames may be normalized by the
            server, but clients should not rely on that form.
          example: /album-covers/%D0%93%D0%BE%D1%80%D0%B3%D0%BE%D1%80%D0%BE%D0%B4_2.jpg
        authorIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          description: Ignored on write; server recalculates this field from album tracks.
        releaseDate:
          type: string
          format: date-time
        isPublished:
          type: boolean
        trackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
          description: May be empty when creating or updating an album.
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
      required: [title, releaseDate, isPublished, trackIds, additionalInfo]

    Track:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        authorIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        albumId:
          type: integer
          format: int64
          minimum: 1
        audioFilePath:
          type: string
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
        isFavorite:
          type: boolean
        isAvailable:
          type: boolean
      required: [id, name, authorIds, albumId, audioFilePath, additionalInfo, isFavorite, isAvailable]

    UpsertTrackRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
        authorIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
        albumId:
          type: integer
          format: int64
          minimum: 1
        albumOrder:
          type: integer
          minimum: 0
        audioFilePath:
          type: string
          description: |
            Path or URL of an existing song file, typically `/songs/{name}`.

            This is a reference to an existing uploaded MP3, not an owned file
            object. Changing this field only changes the stored reference.
            Deleting the track does not delete the referenced MP3 from storage.
          minLength: 1
        additionalInfo:
          type: array
          items:
            $ref: '#/components/schemas/AdditionalInfo'
      required: [name, authorIds, albumId, albumOrder, audioFilePath, additionalInfo]

    LyricsType:
      type: string
      enum: [plain, synced]

    SyncedLyricsLine:
      type: object
      properties:
        startMs:
          type: integer
          minimum: 0
        endMs:
          type: integer
          nullable: true
          minimum: 0
        text:
          type: string
          minLength: 1
      required: [startMs, text]

    TrackLyrics:
      type: object
      properties:
        trackId:
          type: integer
          format: int64
          minimum: 1
        type:
          $ref: '#/components/schemas/LyricsType'
        languageCode:
          type: string
          nullable: true
        isVerified:
          type: boolean
        source:
          type: string
          nullable: true
        plainText:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SyncedLyricsLine'
      required: [trackId, type, isVerified, lines]

    UpsertTrackLyricsRequest:
      type: object
      properties:
        type:
          $ref: '#/components/schemas/LyricsType'
        languageCode:
          type: string
          nullable: true
        isVerified:
          type: boolean
        source:
          type: string
          nullable: true
        plainText:
          type: string
          nullable: true
        lines:
          type: array
          items:
            $ref: '#/components/schemas/SyncedLyricsLine'
      required: [type, isVerified]

    PlaylistVisibility:
      type: string
      enum: [private, public, shared]

    Playlist:
      type: object
      properties:
        id:
          type: integer
          format: int64
        userId:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        coverImagePath:
          type: string
        visibility:
          $ref: '#/components/schemas/PlaylistVisibility'
        trackCount:
          type: integer
        system:
          type: boolean
        isFavorites:
          type: boolean
      required: [id, userId, name, description, coverImagePath, visibility, trackCount, system, isFavorites]

    UpsertPlaylistRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 200
        description:
          type: string
          minLength: 1
          maxLength: 1000
        coverImagePath:
          type: string
        visibility:
          $ref: '#/components/schemas/PlaylistVisibility'
      required: [name, description, coverImagePath, visibility]

    AddTrackToPlaylistsRequest:
      type: object
      properties:
        playlistIds:
          type: array
          minItems: 1
          items:
            type: integer
            format: int64
            minimum: 1
      required: [playlistIds]

    ReorderPlaylistTracksRequest:
      type: object
      properties:
        trackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
      required: [trackIds]

    AutoplaySourceType:
      type: string
      enum: [my_vibe, playlist, album, track]

    AutoplayNextRequest:
      type: object
      properties:
        sourceType:
          $ref: '#/components/schemas/AutoplaySourceType'
        sourceId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
          description: |
            Required for `playlist`, `album`, and `track`. Must be omitted for
            `my_vibe`.
        profile:
          type: string
          default: default
          description: |
            Future-facing personalization profile such as `default`, `work`,
            `sleep`, or `workout`.
        count:
          type: integer
          minimum: 1
          maximum: 50
          default: 1
        recentTrackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
        excludedTrackIds:
          type: array
          items:
            type: integer
            format: int64
            minimum: 1
      required: [sourceType, count, recentTrackIds, excludedTrackIds]

    AutoplayNextResponse:
      type: object
      properties:
        sourceType:
          $ref: '#/components/schemas/AutoplaySourceType'
        sourceId:
          type: integer
          format: int64
          minimum: 1
          nullable: true
        profile:
          type: string
        strategy:
          type: string
        tracks:
          type: array
          items:
            $ref: '#/components/schemas/Track'
      required: [sourceType, profile, strategy, tracks]

    PaginatedAlbums:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Album'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    PaginatedTracks:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Track'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    PaginatedPlaylists:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/Playlist'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    SearchResultItem:
      type: object
      properties:
        type:
          type: string
          enum: [author, album, track]
        author:
          $ref: '#/components/schemas/Author'
        album:
          $ref: '#/components/schemas/Album'
        track:
          $ref: '#/components/schemas/Track'
      required: [type]

    PaginatedSearchResults:
      type: object
      properties:
        items:
          type: array
          items:
            $ref: '#/components/schemas/SearchResultItem'
        page:
          type: integer
        pageSize:
          type: integer
        totalItems:
          type: integer
        totalPages:
          type: integer
      required: [items, page, pageSize, totalItems, totalPages]

    RegisterRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 8
      required: [email, password]

    LoginRequest:
      type: object
      properties:
        email:
          type: string
          format: email
        password:
          type: string
      required: [email, password]

    RefreshRequest:
      type: object
      properties:
        refreshToken:
          type: string
      required: [refreshToken]

    TelegramStartImportRequest:
      type: object
      properties:
        channelUsername:
          type: string
          description: Public Telegram channel username, with or without `@`.
        startMessageId:
          type: integer
          description: |
            Optional Telegram message ID to start from, inclusive. When omitted or
            set to `0`, the import starts from the earliest scanned track.
          minimum: 0
        replaceExisting:
          type: boolean
          description: Replace the active Telegram import session for the current user.
      required: [channelUsername]

    TelegramCurrentTrack:
      type: object
      properties:
        messageId:
          type: integer
        telegramMessageLink:
          type: string
        parsedTitle:
          type: string
        fileName:
          type: string
        mimeType:
          type: string
        sizeBytes:
          type: integer
          format: int64
        tempFileDownloadUrl:
          type: string
      required:
        - messageId
        - telegramMessageLink
        - parsedTitle
        - fileName
        - mimeType
        - sizeBytes
        - tempFileDownloadUrl

    TelegramImportProgress:
      type: object
      properties:
        total:
          type: integer
        processed:
          type: integer
        remaining:
          type: integer
        skipped:
          type: integer
        saved:
          type: integer
      required: [total, processed, remaining, skipped, saved]

    TelegramImportSession:
      type: object
      properties:
        sessionId:
          type: string
        status:
          type: string
        channelUsername:
          type: string
        currentTrack:
          $ref: '#/components/schemas/TelegramCurrentTrack'
        progress:
          $ref: '#/components/schemas/TelegramImportProgress'
        createdAt:
          type: string
          format: date-time
        updatedAt:
          type: string
          format: date-time
      required:
        - sessionId
        - status
        - channelUsername
        - progress
        - createdAt
        - updatedAt

    PublicUser:
      type: object
      properties:
        id:
          type: integer
          format: int64
        email:
          type: string
          format: email
        role:
          type: string
          enum: [admin, listener]
        createdAt:
          type: string
          format: date-time
      required: [id, email, role, createdAt]

    AuthResponse:
      type: object
      properties:
        user:
          $ref: '#/components/schemas/PublicUser'
        accessToken:
          type: string
        accessTokenExpiresAt:
          type: string
          format: date-time
        refreshToken:
          type: string
        refreshTokenExpiresAt:
          type: string
          format: date-time
      required:
        - user
        - accessToken
        - accessTokenExpiresAt
        - refreshToken
        - refreshTokenExpiresAt
