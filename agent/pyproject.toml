[project]
name = "esketit-agent"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn[standard]>=0.34,<1",
  "sqlalchemy>=2.0,<3", "psycopg[binary,pool]>=3.2,<4",
  "langgraph>=1.0,<2", "langgraph-checkpoint-postgres>=3,<4",
  "openai>=2,<3", "mcp>=1.20,<2", "firebase-admin>=7,<8",
  "httpx>=0.28,<1",
]

[project.optional-dependencies]
test = ["pytest>=8,<10", "ruff>=0.14,<1", "langgraph-checkpoint-sqlite>=3,<4"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
